name: Scrape PSA (Playwright)

on:
  schedule:
    # Every 12 hours — PSA pop data doesn't churn as fast as eBay
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install playwright tf-playwright-stealth psycopg2-binary
          playwright install chromium --with-deps

      - name: Run PSA scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/psa_runner.py
