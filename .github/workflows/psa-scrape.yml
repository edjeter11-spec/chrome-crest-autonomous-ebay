name: Scrape PSA (Playwright)

on:
  schedule:
    # Weekly (Sundays 06:00 UTC). PSA pop reports update slowly — weekly
    # snapshots are plenty for 'how rare is a PSA 10' tracking. Fits free tier.
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-py3.11-v3

      - name: Install Python deps
        run: pip install playwright tf-playwright-stealth psycopg2-binary

      - name: Install Playwright browser + system deps
        run: playwright install chromium --with-deps

      - name: Run PSA scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/psa_runner.py
