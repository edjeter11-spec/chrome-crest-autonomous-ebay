name: Scrape eBay (Playwright)

on:
  schedule:
    # Every 3 hours — cuts the max discovery gap from 6h to 3h.
    # A listing posted at T=0 ending at T+5h was previously invisible between
    # T=0 and T=6 (next scraper run). At 3h cadence it gets picked up at T+3h
    # with 2h left, which is enough to surface it in the Ending Soonest strip.
    - cron: '13 */3 * * *'
  workflow_dispatch:  # manual trigger from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Cache the ~150MB Chromium browser binary — saves ~90s per run vs.
      # downloading fresh. Key on Python version since Playwright pins
      # browser to its Python wheel version.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # v3 — bumped because the conditional 'if dir exists' check matched
          # the old 'chromium-*' dir even after Playwright switched to
          # 'chromium_headless_shell-*' for headless. Result: install-deps ran
          # but browser binary was missing → BrowserType.launch crashed every
          # scheduled run for a week. Now we always run `playwright install`
          # which uses cache when valid and downloads fresh when not.
          key: pw-chromium-py3.11-v3

      - name: Install Python deps
        run: pip install playwright tf-playwright-stealth psycopg2-binary

      - name: Install Playwright browser + system deps
        run: playwright install chromium --with-deps

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/scrape_runner.py
