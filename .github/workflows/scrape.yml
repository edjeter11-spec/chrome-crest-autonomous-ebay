name: Scrape eBay (Playwright)

on:
  schedule:
    # Every hour — cuts auction staleness from 3h → 1h. Stays under any quota
    # because the scraper uses Playwright on the public site (not Browse API).
    - cron: '0 * * * *'
  workflow_dispatch:  # manual trigger from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install playwright tf-playwright-stealth psycopg2-binary
          playwright install chromium --with-deps

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/scrape_runner.py
