name: Scrape eBay (Playwright)

on:
  schedule:
    # Every 6 hours (was hourly). Cost-tier change: at hourly the Playwright
    # scraper alone burns ~720 runs × ~10min = 120hrs/month, blowing the GH
    # Free 500-min/mo private-repo cap by 14×. At every-6h it's ~5hrs/month,
    # well under free tier. eBay auctions have multi-day lifespans so 6h
    # cadence is plenty for tracking purposes.
    - cron: '13 */6 * * *'
  workflow_dispatch:  # manual trigger from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install playwright tf-playwright-stealth psycopg2-binary
          playwright install chromium --with-deps

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/scrape_runner.py
