name: Probe sold-search variants (diagnostic)

# TEMP diagnostic (2026-07-29): eBay blocks the GH Actions runner on sold
# searches (title "Security Measure" / "Sign in or Register") while active
# auction/BIN searches from the SAME runner succeed. This probes a matrix of
# URL/param/header variants FROM THE RUNNER to find any shape that returns
# real sold results. Local testing can't answer this — the dev machine's own
# IP is fully challenged by eBay.
# Delete this workflow once a working shape is found (or ruled out).

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install playwright tf-playwright-stealth && playwright install chromium --with-deps

      - name: Probe variants
        run: python scripts/probe_sold.py
