name: Data Scrape (Tier-A sources + blocked retries)

on:
  schedule:
    # Daily 04:15 UTC (was every 6h). Cost-tier cut: 4 runs/day × ~60min
    # was burning ~120hrs/mo. Daily run is ~30hrs/mo, fits GH Free.
    - cron: '15 4 * * *'
  workflow_dispatch:

jobs:
  tier-a:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-py3.11-v3

      - name: Install Python deps
        run: pip install playwright tf-playwright-stealth psycopg2-binary httpx beautifulsoup4 sqlalchemy

      - name: Install Playwright browser + system deps
        run: playwright install chromium --with-deps

      - name: SportsCardsPro (full set + sale history)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCP_MAX_DETAIL: '120'
        run: python scripts/sportscardspro_runner.py
        continue-on-error: true
        timeout-minutes: 20

      - name: eBay broad (driver + parallel queries)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/ebay_broad_runner.py
        continue-on-error: true
        timeout-minutes: 25

      # eBay-detail step LAST so it doesn't block the new sources.
      # Capped so it can't eat all the runtime.
      - name: eBay detail-page deepen (last, capped)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_URLS: '30'
          PER_URL_TIMEOUT_MS: '20000'
        run: python scripts/ebay_sitemap_runner.py
        continue-on-error: true
        timeout-minutes: 15

      - name: Upload block-evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-artifacts
          path: scrape_artifacts/
          if-no-files-found: ignore
          retention-days: 7
