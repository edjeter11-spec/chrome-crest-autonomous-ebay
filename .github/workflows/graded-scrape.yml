name: Graded Scrape (Goldin + PWCC + MySlabs)

on:
  schedule:
    # Every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  graded:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install playwright tf-playwright-stealth psycopg2-binary
          playwright install chromium --with-deps

      - name: Run Goldin scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/goldin_runner.py
        continue-on-error: true

      - name: Run PWCC scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/pwcc_runner.py
        continue-on-error: true

      - name: Run MySlabs scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/myslabs_runner.py
        continue-on-error: true

      - name: Upload block-evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graded-scrape-artifacts
          path: scrape_artifacts/
          if-no-files-found: ignore
          retention-days: 7
